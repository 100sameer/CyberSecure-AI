version: '3.8'

services:
  cybersecure-ai:
    build: .
    ports:
      - "3000:3000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NODE_ENV=production
    volumes:
      - ./uploaded_docs:/app/uploaded_docs
      - ./vector_db:/app/vector_db
      - ./reports:/app/reports
    restart: unless-stopped
